<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 연습</title>
    <style>
        /* 부모인 container 공통 CSS=> display : flex */
        .container{
            /* 부모요소가 아니라 container의 자식요소를 가로 배치한다. */
            display: flex;
            width: 400px;
            border: 2px solid green;
            margin: 0 auto;
            /* align-items 속성은 한 줄일 때 사용하므로 부모의 높이가 없으면 무의미
                center는 세로의 가운데를 의미
            */
            /* align-items: center; */
            height: 400px;
            /* flex로 자동개행 속성 : flex-wrap */
            flex-wrap: wrap;
            /* 세로 정렬 */
            align-content: space-evenly;
            /* 가로 정렬 */
            justify-content: space-evenly;
        }
 
        .container .box{
            width: 100px;
            height: 100px;
            /* border: 1px solid red; */
            background-color: crimson;
            border-radius: 5px;
            margin: 5px;
            color: white;
        }
    </style>
</head>
<body>
    <!-- align-contenct 속성은 자식요소들이 줄바꿈되어 2줄 이상 되었을 때
        줄 단위로 정렬하는 속성 
        align-item : 아이템(자식요소들) 한 줄로 있을 때
        align-content : 아이템(자식요소들) 2줄 ,3줄(flex-wrap:wrap) 
        되었을 때 전체 중 덩어리를 위/아래/가운데로 정렬하는 속성
    -->
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
        <div class="box">box6</div>
        <div class="box">box7</div>
        <div class="box">box8</div>
        <div class="box">box9</div>
    </div>


</body>
</html>
