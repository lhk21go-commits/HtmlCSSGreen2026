<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 연습문제 1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px 0;
        }
        /* plan 클래스의 공통 CSS*/
        .plan{
            /* plan을 모두 div태그로 작성하므로 가로롤 배치안됨
                가로로 배치하기 위해서 display : inline-bolock으로
                변경한다. 이유는 div태그는 block태그로 가로 배치가 안되고 세로
                배치가 된다.
            */
            display: inline-block;
            width: 220px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            padding: 30px 20px;
            margin: 0 15px;
            text-align: center;
        }
        /* featured의  */
        .featured{
            background-color: #1e2a4a;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        /* 공통 span 부분 */
        .price span{
            font-size: 2rem;
            font-weight: bold;
            color: #1e2a4a;
        }
        /* featured의 CSS  */
        .featured .price span{
            color: #ffffff;
        }
 
        /* 공통 price */
        .price{
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        /*featured 부분 CSS */
        .featured .price{
            color: #ddd;
        }
        hr{
            border: none;
            border-top: 1px solid #ddd;
            margin: 15px 0;
        }
        .featured hr{
            border-top: 1px solid;
        }
        /* 반드시 부모인 ul에서 list-style을 제거 */
        ul{
            list-style: none;
            text-align: left;
        }
        li{
            margin-bottom: 10px;
            font-size: 10px;
        }
        /* button 공통 */
        button{
            /* 부모의 가로사이즈 크기 자동지정 */
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 20px;
            background-color: #1e2a4a;
            font-size: 14px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover{
            background-color: #3b4d7a;
        }
        .featured button{
            background-color: #ffffff;
            color: #1e2a4a;
        }
        .featured:hover{
            background-color: #dddddd;
        }
        li::before{
            content: '\2713';
            color: #2ecc71;
            font-weight: bold;
        }
        /* 가상요소 선택자
            ::before, ::after의 요소가 존재한다.
            실제로 존재하지 않는 가상의 요소를 HTML 앞 또는 뒤에 
            삽입해 주는 선택자 입니다.
            단, 가상요소 선택자는 반드시 내용(content)가 존재해야 한다.
            content : '가상문자'
            가상문자는 아이콘, 기호, 텍스트 모두 가능
            이모지콘 : 윈도우키 + .=> ✔️
            특수문자 : 한글자음 + 한자키 => √
            유니코드 : \2713 => \2713
        */


    </style>

</head>
<body>
    <div class="plan">
        <div class="price">
            <h3>Basic</h3><br>
            <p><span>$9</span>/month</p>
        </div><hr>
        <div class="features">
            <ul>
                <li>5 Projects</li>
                <li>1GB Storage</li>
                <li>Email Support</li>
            </ul>
        </div>
        <button type="button">Choose Plan</button> 
    </div>   
    <div class="plan featured">
        <div class="price">
            <h3>Standard</h3><br>
            <p><span>$19</span>/month</p>
        </div><hr>
        <div class="features">
            <ul>
                <li>20 Projects</li>
                <li>10GB Storage</li>
                <li>Priority Support</li>
            </ul>
        </div>
        <button type="button">Choose Plan</button> 
        
    </div>
    
    <div class="plan">
        <div class="price">
            <h3>Premium</h3><br>
            <p><span class="price">$39</span>/month</p>
        </div><hr>
        <div class="features">
            <ul>
                <li>Unlimited Projects</li>
                <li>100GB Storage</li>
                <li>24/7 Phone Support</li>
            </ul>


        </div>
            <button type="button">Choose Plan</button> 
    </div>       
        

        


        
        
    </div>

    
</body>
</html>
