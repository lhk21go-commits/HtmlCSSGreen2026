<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 회원가입</title>
</head>
<body>
    <form action="#" method="get">
        <div>
            <h1>회원가입</h1><br/>
        </div>
        <div>
            <span>*</span>
            <label for="필수입력사항">필수입력사항</label>
        </div>
        <ul>
            <li>
                <label for="아이디">아이디</label>
                 <span>*</span>
                 <input type="text" placeholder="아이디를 입력해 주세요" />
            </li>
            <li>
                <label for="비밀번호">비밀번호</label>
                 <span>*</span>
                 <input type="password" placeholder="비밀번호를 입력해 주세요" />
            </li>
            <li>
                <label for="비밀번호확인">비밀번호확인</label>
                 <span>*</span>
                 <input type="password" placeholder="비밀번호를 한번 더 입력해 주세요" />
            </li>
            <li>
                <label for="이름">이름</label>
                 <span>*</span>
                 <input type="text" placeholder="이름을 입력해 주세요" />
            </li>
            <li>
                <label for="이메일">이메일</label>
                 <span>*</span>
                 <input type="email" placeholder="예:marketkurly     @" />
                 <select name="메일회사" id="메일회사">
                    <option value="">선택하기</option>
                    <option value="naver.com">naver.com</option>
                    <option value="gmail.com">gmail.com</option>
                    <option value="hanmail.net">hanmail.net</option>
                    <option value="kakao.com">kakao.com</option>
                    <option value="daum.net">daum.net</option>
                    <option value="yahoo.co.kr">yahoo.co.kr</option>
                    <option value="직접 입력">직접 입력</option>
                 </select>
            </li>
            <li>
                <label for="휴대폰">휴대폰</label>
                 <span>*</span>
                 <input type="number" placeholder="숫자만 입력해주세요" />
                 <button>인증번호 받기</button>
            </li>
            <li>
                <label for="주소">주소</label>
                 <span>*</span>
                 <button>주소 검색</button>
            </li>
        </ul>


</form>
</body>
</html>
