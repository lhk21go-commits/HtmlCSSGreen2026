<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 회원가입</title>
    <link rel="stylesheet" href="/kurly_join.css">
</head>
<body>
    
  <h2>회원가입</h2>
  <p>* 필수입력사항</p>
  <hr>

  <form action="#" method="get">
    
    <div>
      <label for="userId">아이디 *</label>
      <input type="text" id="userId" name="userId" placeholder="아이디를 입력해주세요" required>
    </div>

    <div>
      <label for="userPw">비밀번호 *</label>
      <input type="password" id="userPw" name="userPw" placeholder="비밀번호를 입력해주세요" required>
    </div>

    <div>
      <label for="userPwCheck">비밀번호확인 *</label>
      <input type="password" id="userPwCheck" name="userPwCheck" placeholder="비밀번호를 한번 더 입력해주세요" required>
    </div>

    <div>
      <label for="userName">이름 *</label>
      <input type="text" id="userName" name="userName" placeholder="이름을 입력해주세요" required>
    </div>

    <div>
      <label for="userEmail">이메일 *</label>
      <input type="text" id="userEmail" name="userEmail" placeholder="예: marketkurly" required>
      <span>@</span>
      <select name="emailDomain">
        <option value="">선택하기</option>
        <option value="naver.com">naver.com</option>
        <option value="gmail.com">gmail.com</option>
        <option value="gmail.com">hanmail.net</option>
        <option value="gmail.com">kakao.com</option>
        <option value="daum.net">daum.net</option>
        <option value="daum.net">hotmail.net</option>
        <option value="daum.net">yahoo.com</option>
        <option value="daum.net">직접 입력</option>
      </select>
    </div>

    <div>
      <label for="userPhone">휴대폰 *</label>
      <input type="tel" id="userPhone" name="userPhone" placeholder="숫자만 입력해주세요" required>
      <button type="button">인증번호 받기</button>
    </div>

    <div>
      <label>주소 *</label>
      <button type="button">주소 검색</button>
      <p style="font-size: 12px; color: gray;">배송지에 따라 상품 정보가 달라질 수 있습니다.</p>
    </div>

    <div>
      <label>성별</label>
      <input type="radio" id="genderMale" name="gender" value="male">
      <label for="genderMale">남자</label>
      
      <input type="radio" id="genderFemale" name="gender" value="female">
      <label for="genderFemale">여자</label>
      
      <input type="radio" id="genderNone" name="gender" value="none" checked>
      <label for="genderNone">선택안함</label>
    </div>

    <div>
      <label>생년월일</label>
      <input type="text" name="birthYear" placeholder="YYYY" size="4" maxlength="4"> /
      <input type="text" name="birthMonth" placeholder="MM" size="2" maxlength="2"> /
      <input type="text" name="birthDay" placeholder="DD" size="2" maxlength="2">
    </div>

        <div>
    <label>추가입력 사항</label>
    
    <div style="display: inline-block; vertical-align: top; margin-left: 20px;">
        
        <div>
        <input type="radio" id="recommend" name="additional" value="recommend" checked>
        <label for="recommend"><strong>친구초대 추천인 아이디</strong></label>
        </div>

        <div style="margin-top: 10px;">
        <input type="text" id="recommendId" name="recommendId" placeholder="추천인 아이디 입력">
        <button type="button">아이디 확인</button>
        </div>

        <div style="margin-top: 8px; font-size: 12px; color: gray; line-height: 1.5;">
        <p style="margin: 0;">- ID 입력시, 대소문자 및 띄어쓰기에 유의 부탁드립니다.</p>
        <p style="margin: 0;">- 가입 이후는 수정이 불가능합니다.</p>
        </div>

    </div>
    </div>

    <hr> 

    <div class="terms-row">
        <label class="terms-title">이용약관동의 *</label>
        
        <div class="terms-content-box">
            
            <div class="term-item all-agree">
            <input type="checkbox" id="agreeAll" name="agreeAll">
            <label for="agreeAll"><strong>전체 동의합니다.</strong></label>
            <p class="term-subtext">선택 항목에 동의하지 않은 경우도 회원가입 및 일반적인 서비스를 이용할 수 있습니다.</p>
            </div>

            <div class="term-item">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
            <label for="agreeTerms">컬리 이용약관 동의 (필수)</label>
            </div>

            <div class="term-item">
            <input type="checkbox" id="agreePrivacy" name="agreePrivacy" required>
            <label for="agreePrivacy">개인정보 수집·이용 (필수)</label>
            </div>

            <div class="term-item">
            <input type="checkbox" id="agreeMarketing" name="agreeMarketing">
            <label for="agreeMarketing">이벤트 및 혜택정보 발송을 위한 수집·이용 (선택)</label>
            </div>

            <div class="term-item sub-marketing-box">
            <input type="checkbox" id="subSms" name="subMarketing" value="sms">
            <label for="subSms">문자</label>
            
            <input type="checkbox" id="subEmail" name="subMarketing" value="email">
            <label for="subEmail">이메일</label>
            
            <input type="checkbox" id="subKakao" name="subMarketing" value="kakao">
            <label for="subKakao">카카오</label>
            </div>

            <div class="term-item">
            <input type="checkbox" id="agreeAge" name="agreeAge" required>
            <label for="agreeAge">본인은 만 14세 이상입니다. (필수)</label>
            </div>

        </div>
    </div>

    <br>

    <div>
      <button type="submit" style="width: 100%; padding: 10px;">가입하기</button>
    </div>

  </form>

</body>
</html>
