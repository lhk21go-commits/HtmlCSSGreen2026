<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .card-container{
            display: flex;
            width: 1200px;
            /* border: 1px solid red; */
            margin: 20px auto;
        }
        .card-container .card{
            width: 350px;
            height: 100px;
            background-color: rgb(23, 172, 231);
            border-radius: 10px;
            margin: 0 20px;
            text-align: center;
            color: white;
            line-height: 50px;
        }



    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h3>Card 1</h3>
            <p>첫 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>두 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>세 번째 카드 설명입니다.</p>
        </div>
    </div>
</body>
</html>
