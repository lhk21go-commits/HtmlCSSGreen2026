<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 연습문제 4</title>
    <style>
        *{  
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            font-family: sans-serif;
            background-color: #ccc;
            padding-top: 50px;
        }

        .menu{
            width: 400px;
            padding: 20px;
            border: ipx solid #ccc;
            background-color: #f5ecdf;
            border-radius: 10px;

        }
        h1{
            letter-spacing: 4px;
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
        }
        ul{
            list-style: none;
        }

        li{
            border-bottom: 1px black dashed;
            padding: 10px 0;
            font-size: 15px;
            
        }

        span{
            float: right;
        }
    </style>


</head>
<body>

    <div class="menu">
        <h1 class="head">Café Menu</h1>
        <ul>
            <li>AMERICANO   <span>$3.50</span></li>
            <li>LATTE   <span>$4.00</span></li>
            <li>CAPPUCCINO  <span>$4.20</span> </li>
        </ul>


    </div>

    
</body>
</html>
