<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .login-box{
            /* display: flex; */
            width: 500px;
            height: 400px;
            text-align: center;
            background-color: white;
            box-shadow: 5px 5px 10px;
            border-radius: 10px;
            
        }
        input, button{
            width: 450px;
            height: 50px;
            margin-bottom: 10px;
            border-radius: 10px;
        }
        button{
            background-color: orange;
            font-size: 20px;
            color: white;
        }


    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" placeholder="아이디 입력" />
        <input type="password" placeholder="비밀번호 입력" />
        <button>로그인</button>
    </div>
</body>
</html>
