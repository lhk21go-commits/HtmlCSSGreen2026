<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>naver login</title>
    <link rel="stylesheet" href="/styleCss/style_login.css">
</head>
<body>
    <div class="login-wrap">
        <h1>NAVER</h1>

        <div class="login-box">
            <form action="#" method="get">
                <div class="inp">
                    <input type="text"  placeholder="아이디 또는 전화번호"/>
                    <input type="password"  placeholder="비밀번호"/>
                </div>
                <div class="login-check">
                    <div class="status">
                        <input type="checkbox" id="check"/> 
                        <label for="check">로그인 상태유지</label>
                    </div>
                    <div class="ip">
                        <span>IP 보안</span>
                    </div>
                </div>
                <div class="button">
                    <button class="passkey">패스키 로그인</button>
                    <button class="login">로그인</button>
                </div>
                <div class="p">
                    <span>QR 코드 로그인</span>
                    <span>|</span>
                    <span>일회용 번호 로그인</span>
                </div>    

            </form>
        </div>



    </div>

    
</body>
</html>
