<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed 포지션</title>
    <style>
      .parent{
        background-color: dodgerblue;
        width: 800px;
        height: 300px;
        /* 부모 */
        position: relative;
      }
      .child{
        background-color: red;
        width: 200px;
        height: 100px;
        /* 자식 */
        position: absolute;
        right: 20px;
        bottom: 50px;
      }
      .parent02{
        border: 1px solid red;
        width: 600px;
        height: 300px;
        margin: 0 auto;
        position: relative;
      }
      /* 공통 box CSS */
      .box{
        width: 100px;
        height: 100px;
        color: white;
        font-weight: bold;
        font-size: 14px;
        text-align: center;
        /* border: 1px solid blue; */
        display: inline-block;
        position: absolute;
      }
      /* position이 존재하지 않는 경우 left, right, top, bottom 사용 못함 */
      .inline-top-left{
        background-color: orange;
        top: 0;
        left: 0
        ;
      }
      .inline-top-right{
        background-color: orange;
        top: 0;
        right: 0
        ;
      }
      .inline-bottom-left{
        background-color: orange;
        bottom: 0;
        left: 0
        ;
      }
       .inline-bottom-right{
        background-color: orange;
        bottom: 0;
        right: 0
        ;
      }
       .inline-center{
        /* 부모의 정가운데 위치
          자식요소의 왼쪽 상단 모서리가 정가운데 위치
        
        */
        background-color: crimson;
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
      }

      /* 부모 바깥쪽 */
      .child1{
        background-color: dodgerblue;
        top: 100%;  /* top: 100% == top:300px 부모높이*/
        left: 0;
        font-size: 24px;
      }
       .child2{
        background-color: dodgerblue;
        top: 0; 
        left: 100%;  /* left: 100% == left:600px 부모너비*/
        font-size: 24px;
      }
       .child3{
        background-color: dodgerblue;
        top: 100%;  /* top: 100% == top:300px 부모높이*/
        left: 100%;   /* left: 100% == left:600px 부모너비*/
        font-size: 24px;
      }

    </style>
</head>
<body>
   <div class="parent">
     <div class="child"></div>
   </div>
   <hr/>

   <div class="parent02">
        <div class="box inline-top-left">top:0<br/>left:0</div>
        <div class="box inline-top-right">top:0<br/>right:0</div>
        <div class="box inline-bottom-left">bottom:0<br/>left:0</div>
        <div class="box inline-bottom-right">bottom:0<br/>right:0</div>
        <div class="box inline-center">center</div>

        <div class="box child1">1</div>
        <div class="box child2">2</div>
        <div class="box child3">3</div>


   </div>


</body>
</html>
