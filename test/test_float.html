<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 가로배치 하기</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        .parent{
            border: 5px solid red;
            width: 600px;
            /* 자식의 높이 값을 받는다 */
            /* height: 200px; */
            /* overflow: hidden을 지정하면 부모높이보다 
                자식의 높이가 넘쳐 화면에 숨기고 싶을 때    
            */
            /* overflow: hidden; */
            font-size: 15px;
            margin: 0 auto;
        }
        .child{
            font-size: inherit; /* 부모의 글꼴 크기를 상속 받음*/
            background-color: gold;
            width: 200px;
            height: 300px;
            /* float의 left로 왼쪽 정렬을 하려면 한다.
                자식에 float을 지정하면 부모는 자식이 없다고 여겨서
                높이 값을 잃는다.
            */
            /* float: left; */
            /* display: inline-block; */
            display: block;
            /* block 요소에만 margin: auto를 사용할 수 있다. */
            margin: auto;
        }
        .parent02{
            /* border: 3px solid blue; */
            width: 600px;
        }
        .top{
            background-color: blueviolet;
            height: 50px;
        }
        .left{
            background-color: skyblue;
            height: 50px;
            width: 200px;
            float: left;
        }
        .right{
            background-color: brown;
            height: 50px;
            width: 400px;
            float: right;
        }
        .clear{
            /* clear는 float을 지정하지 않았지만, 위의 태그에
            float을 지정한 경우, 자동으로 상속받는다.
            그러므로 위의 태그의 float을 해제해야 한다.
            해제하는 방법 : clear both*/
            background-color: dodgerblue;
            height: 50px;
        }



    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child</div>
    </div>
    <hr/>

    <div class="parent02">
        <div class="top">float:none</div>
        <div class="left">float:left</div>
        <div class="right">float:right</div>
        <div class="clear">flooat:clear</div>

    </div>

</body>
</html>
