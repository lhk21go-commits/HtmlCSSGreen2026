<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 연습문제 1</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body{
            font-family: sans-serif;
            font-size: 16px;
           
        }
        .head{
           width: 550px;
           padding: 5px;
           border-radius: 20px 20px 20px 20px;
           background-color: black;
           color: aliceblue;
           box-shadow: 10px 10px 20px rgba(16, 7, 7, 0.672);

           text-align: center;
           margin-bottom: 20px;
        }
        ul{
            list-style: none;
            /* padding: 0; */
        }
        span{
            color: blue;
            font-weight: bold;
            
        }

    </style>

</head>
<body>
    <div class="box">
        <div class="head">
            <h1>Best Coffee Beans of the World</h1>
        </div>
        <div class="list">
            <ul>
                <li><span><u>Ethiopia Yirgacheffe</u></span>
                : Known for its bright acidity and floral, cittrus notes.
                </li>
                <li><span><u>Colombia Supremo</u></span>
                : Balanced flavor with a nutty, caramel sweetness.
                </li>
                <li><span><u>Guatemala Antigua</u></span>
                : Rich body with smoky, chocolate undertones.
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
